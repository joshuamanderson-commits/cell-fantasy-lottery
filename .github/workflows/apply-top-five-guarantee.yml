name: Apply Top Five Guarantee Patch

on:
  push:
    paths:
      - '.github/workflows/apply-top-five-guarantee.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch lottery rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          def r(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s = s.replace(old, new, 1)

          old = ("const buildPickRecord = (team, poolBeforePick) => {\n"
                 "                const pickBallCount = getTeamBallCountInPool(team.id, poolBeforePick);\n"
                 "                const pickTotalBalls = poolBeforePick.length;\n"
                 "                const pickPercentage = pickTotalBalls > 0 ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1) : '0.0';\n\n"
                 "                return {\n"
                 "                    ...team,\n"
                 "                    pickBallCount,\n"
                 "                    pickTotalBalls,\n"
                 "                    pickPercentage,\n"
                 "                };\n"
                 "            };")
          new = ("const buildPickRecord = (team, poolBeforePick, topFiveGuaranteeApplied = false) => {\n"
                 "                const pickBallCount = getTeamBallCountInPool(team.id, poolBeforePick);\n"
                 "                const pickTotalBalls = poolBeforePick.length;\n"
                 "                const pickPercentage = topFiveGuaranteeApplied ? '100.0' : (pickTotalBalls > 0 ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1) : '0.0');\n\n"
                 "                return {\n"
                 "                    ...team,\n"
                 "                    pickBallCount,\n"
                 "                    pickTotalBalls,\n"
                 "                    pickPercentage,\n"
                 "                    topFiveGuaranteeApplied,\n"
                 "                };\n"
                 "            };")
          r(old, new, 'pick record')

          marker = "const buildBallPool = () => {"
          helpers = ("const getTopFiveProtectedTeam = () => teams.find(team => team.position === 1);\n\n"
                     "            const isTopFiveGuaranteeActive = (pickNumber, pool) => {\n"
                     "                const protectedTeam = getTopFiveProtectedTeam();\n"
                     "                return pickNumber === 5 && protectedTeam && pool.includes(protectedTeam.id);\n"
                     "            };\n\n"
                     "            const choosePickIndex = (pool, pickNumber) => {\n"
                     "                if (isTopFiveGuaranteeActive(pickNumber, pool)) {\n"
                     "                    const protectedTeam = getTopFiveProtectedTeam();\n"
                     "                    const protectedIndexes = pool.map((teamId, index) => teamId === protectedTeam.id ? index : -1).filter(index => index !== -1);\n"
                     "                    return { randomIndex: protectedIndexes[getRandomIndex(protectedIndexes.length)], topFiveGuaranteeApplied: true };\n"
                     "                }\n"
                     "                return { randomIndex: getRandomIndex(pool.length), topFiveGuaranteeApplied: false };\n"
                     "            };\n\n"
                     "            const buildBallPool = () => {")
          r(marker, helpers, 'guarantee helpers')

          old = ("const poolBeforePick = [...currentBallPool];\n"
                 "                const randomIndex = getRandomIndex(poolBeforePick.length);\n"
                 "                const selectedId = poolBeforePick[randomIndex];\n"
                 "                const selectedTeam = teams.find(t => t.id === selectedId);\n"
                 "                const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick);")
          new = ("const poolBeforePick = [...currentBallPool];\n"
                 "                const pickNumber = selectedPicks.length + 1;\n"
                 "                const { randomIndex, topFiveGuaranteeApplied } = choosePickIndex(poolBeforePick, pickNumber);\n"
                 "                const selectedId = poolBeforePick[randomIndex];\n"
                 "                const selectedTeam = teams.find(t => t.id === selectedId);\n"
                 "                const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick, topFiveGuaranteeApplied);")
          r(old, new, 'manual draw')

          old = ("while (tempPool.length > 0) {\n"
                 "                    const poolBeforePick = [...tempPool];\n"
                 "                    const randomIndex = getRandomIndex(tempPool.length);\n"
                 "                    const selectedId = tempPool[randomIndex];\n"
                 "                    const selectedTeam = teams.find(t => t.id === selectedId);\n"
                 "                    const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick);")
          new = ("while (tempPool.length > 0) {\n"
                 "                    const poolBeforePick = [...tempPool];\n"
                 "                    const pickNumber = allPicks.length + 1;\n"
                 "                    const { randomIndex, topFiveGuaranteeApplied } = choosePickIndex(poolBeforePick, pickNumber);\n"
                 "                    const selectedId = tempPool[randomIndex];\n"
                 "                    const selectedTeam = teams.find(t => t.id === selectedId);\n"
                 "                    const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick, topFiveGuaranteeApplied);")
          r(old, new, 'simulate all')

          old = ("const nextPickNumber = selectedPicks.length + 1;\n\n"
                 "                return (")
          new = ("const nextPickNumber = selectedPicks.length + 1;\n"
                 "                const topFiveProtectedTeam = getTopFiveProtectedTeam();\n"
                 "                const topFiveGuaranteeActive = isTopFiveGuaranteeActive(nextPickNumber, currentBallPool);\n\n"
                 "                return (")
          r(old, new, 'lottery state')

          old = "<h2 className=\"text-xl md:text-2xl font-bold text-blue-400\">2027 LOTTERY DRAW</h2>"
          new = ("<h2 className=\"text-xl md:text-2xl font-bold text-blue-400\">2027 LOTTERY DRAW</h2>\n"
                 "                                <p className=\"text-blue-300 text-sm mt-2 font-semibold\">#1 finisher is guaranteed a top-5 draft pick.</p>")
          r(old, new, 'rule disclosure')

          old = ("const ballCount = getTeamBallCountInPool(t.id);\n"
                 "                                            const percentage = getTeamOddsInPool(t.id);")
          new = ("const ballCount = getTeamBallCountInPool(t.id);\n"
                 "                                            const isGuaranteedTeam = topFiveGuaranteeActive && t.id === topFiveProtectedTeam?.id;\n"
                 "                                            const percentage = topFiveGuaranteeActive ? (isGuaranteedTeam ? '100.0' : '0.0') : getTeamOddsInPool(t.id);")
          r(old, new, 'live effective odds')

          old = "<div className=\"text-[11px] text-gray-500 mt-0.5\">1 in {formatOneIn(ballCount, totalBalls)}</div>"
          new = ("<div className=\"text-[11px] text-gray-500 mt-0.5\">\n"
                 "                                                                {topFiveGuaranteeActive ? (isGuaranteedTeam ? 'Guaranteed at Pick #5' : 'Not eligible for Pick #5') : `1 in ${formatOneIn(ballCount, totalBalls)}`}\n"
                 "                                                            </div>")
          r(old, new, 'live guarantee label')

          old = "<div className=\"text-xs text-gray-500 mt-1\">About 1 in {formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}</div>"
          new = ("<div className=\"text-xs text-gray-500 mt-1\">\n"
                 "                                                    {modalTeam.topFiveGuaranteeApplied ? 'Guaranteed by league rule' : `About 1 in ${formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}`}\n"
                 "                                                </div>")
          r(old, new, 'modal guarantee label')

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Guarantee #1 finisher a top-five draft pick"
          git rm .github/workflows/apply-top-five-guarantee.yml
          git commit -m "Remove one-time top-five guarantee workflow"
          git push
