name: Apply Top Five Guarantee Patch

on:
  push:
    paths:
      - '.github/workflows/apply-top-five-guarantee.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch lottery rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s = s.replace(old, new, 1)

          replace_once(
          """            const buildPickRecord = (team, poolBeforePick) => {
                const pickBallCount = getTeamBallCountInPool(team.id, poolBeforePick);
                const pickTotalBalls = poolBeforePick.length;
                const pickPercentage = pickTotalBalls > 0 ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1) : '0.0';

                return {
                    ...team,
                    pickBallCount,
                    pickTotalBalls,
                    pickPercentage,
                };
            };""",
          """            const buildPickRecord = (team, poolBeforePick, topFiveGuaranteeApplied = false) => {
                const pickBallCount = getTeamBallCountInPool(team.id, poolBeforePick);
                const pickTotalBalls = poolBeforePick.length;
                const pickPercentage = topFiveGuaranteeApplied
                    ? '100.0'
                    : pickTotalBalls > 0
                        ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1)
                        : '0.0';

                return {
                    ...team,
                    pickBallCount,
                    pickTotalBalls,
                    pickPercentage,
                    topFiveGuaranteeApplied,
                };
            };""",
          'pick record')

          replace_once(
          """            const formatOneIn = (ballCount, totalBalls) => {
                if (!ballCount || !totalBalls) return '—';
                return (totalBalls / ballCount).toFixed(1);
            };

            const buildBallPool = () => {""",
          """            const formatOneIn = (ballCount, totalBalls) => {
                if (!ballCount || !totalBalls) return '—';
                return (totalBalls / ballCount).toFixed(1);
            };

            const getTopFiveProtectedTeam = () => teams.find(team => team.position === 1);

            const isTopFiveGuaranteeActive = (pickNumber, pool) => {
                const protectedTeam = getTopFiveProtectedTeam();
                return pickNumber === 5 && protectedTeam && pool.includes(protectedTeam.id);
            };

            const choosePickIndex = (pool, pickNumber) => {
                if (isTopFiveGuaranteeActive(pickNumber, pool)) {
                    const protectedTeam = getTopFiveProtectedTeam();
                    const protectedIndexes = pool
                        .map((teamId, index) => teamId === protectedTeam.id ? index : -1)
                        .filter(index => index !== -1);

                    return {
                        randomIndex: protectedIndexes[getRandomIndex(protectedIndexes.length)],
                        topFiveGuaranteeApplied: true,
                    };
                }

                return {
                    randomIndex: getRandomIndex(pool.length),
                    topFiveGuaranteeApplied: false,
                };
            };

            const buildBallPool = () => {""",
          'guarantee helpers')

          replace_once(
          """                const poolBeforePick = [...currentBallPool];
                const randomIndex = getRandomIndex(poolBeforePick.length);
                const selectedId = poolBeforePick[randomIndex];
                const selectedTeam = teams.find(t => t.id === selectedId);
                const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick);""",
          """                const poolBeforePick = [...currentBallPool];
                const pickNumber = selectedPicks.length + 1;
                const { randomIndex, topFiveGuaranteeApplied } = choosePickIndex(poolBeforePick, pickNumber);
                const selectedId = poolBeforePick[randomIndex];
                const selectedTeam = teams.find(t => t.id === selectedId);
                const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick, topFiveGuaranteeApplied);""",
          'manual draw')

          replace_once(
          """                while (tempPool.length > 0) {
                    const poolBeforePick = [...tempPool];
                    const randomIndex = getRandomIndex(tempPool.length);
                    const selectedId = tempPool[randomIndex];
                    const selectedTeam = teams.find(t => t.id === selectedId);
                    const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick);

                    allPicks.push(selectedPickRecord);
                    tempPool = tempPool.filter(id => id !== selectedId);
                }""",
          """                while (tempPool.length > 0) {
                    const poolBeforePick = [...tempPool];
                    const pickNumber = allPicks.length + 1;
                    const { randomIndex, topFiveGuaranteeApplied } = choosePickIndex(poolBeforePick, pickNumber);
                    const selectedId = tempPool[randomIndex];
                    const selectedTeam = teams.find(t => t.id === selectedId);
                    const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick, topFiveGuaranteeApplied);

                    allPicks.push(selectedPickRecord);
                    tempPool = tempPool.filter(id => id !== selectedId);
                }""",
          'simulate all')

          replace_once(
          """                            <div className=\"text-center mb-12\">
                                <h1 className=\"text-5xl font-black text-white mb-2\">In Cell We Trust</h1>
                                <h2 className=\"text-2xl font-bold text-blue-400 mb-2\">
                                    BALL PURCHASES
                                </h2>
                                <p className=\"text-gray-400\">Entry: ${entryAmount.toFixed(2)} × 16 teams</p>
                            </div>""",
          """                            <div className=\"text-center mb-12\">
                                <h1 className=\"text-5xl font-black text-white mb-2\">In Cell We Trust</h1>
                                <h2 className=\"text-2xl font-bold text-blue-400 mb-2\">
                                    BALL PURCHASES
                                </h2>
                                <p className=\"text-gray-400\">Entry: ${entryAmount.toFixed(2)} × 16 teams</p>
                                <p className=\"text-blue-300 text-sm mt-3 font-semibold\">League rule: the #1 finisher is guaranteed a top-5 draft pick.</p>
                            </div>""",
          'purchase rule disclosure')

          replace_once(
          """            if (phase === 'lottery') {
                const remaining = teams.filter(t => currentBallPool.includes(t.id));
                const totalBalls = currentBallPool.length;
                const nextPickNumber = selectedPicks.length + 1;

                return (""",
          """            if (phase === 'lottery') {
                const remaining = teams.filter(t => currentBallPool.includes(t.id));
                const totalBalls = currentBallPool.length;
                const nextPickNumber = selectedPicks.length + 1;
                const topFiveProtectedTeam = getTopFiveProtectedTeam();
                const topFiveGuaranteeActive = isTopFiveGuaranteeActive(nextPickNumber, currentBallPool);

                return (""",
          'lottery derived state')

          replace_once(
          """                                        <div className=\"text-blue-400 font-black text-lg uppercase tracking-wide\">Pick #{modalPickNumber}</div>
                                        <div className=\"pick-number-large\">{modalPickNumber}</div>
                                        <div className=\"team-name-large\">{modalTeam.name}</div>

                                        <div className=\"grid grid-cols-2 gap-3 mt-6\">""",
          """                                        <div className=\"text-blue-400 font-black text-lg uppercase tracking-wide\">Pick #{modalPickNumber}</div>
                                        <div className=\"pick-number-large\">{modalPickNumber}</div>
                                        <div className=\"team-name-large\">{modalTeam.name}</div>
                                        {modalTeam.topFiveGuaranteeApplied && (
                                            <div className=\"inline-block bg-blue-500/15 border border-blue-400/40 text-blue-300 px-4 py-2 rounded-full text-sm font-bold\">
                                                #1 Finisher Top-5 Guarantee Applied
                                            </div>
                                        )}

                                        <div className=\"grid grid-cols-2 gap-3 mt-6\">""",
          'modal guarantee badge')

          replace_once(
          """                                                <div className=\"text-3xl font-black text-blue-400\">{modalTeam.pickPercentage}%</div>
                                                <div className=\"text-xs text-gray-500 mt-1\">About 1 in {formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}</div>""",
          """                                                <div className=\"text-3xl font-black text-blue-400\">{modalTeam.pickPercentage}%</div>
                                                <div className=\"text-xs text-gray-500 mt-1\">
                                                    {modalTeam.topFiveGuaranteeApplied
                                                        ? 'Guaranteed by league rule'
                                                        : `About 1 in ${formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}`}
                                                </div>""",
          'modal chance copy')

          replace_once(
          """                            <div className=\"text-center mb-6\">
                                <h1 className=\"text-4xl md:text-5xl font-black text-white mb-2\">In Cell We Trust</h1>
                                <h2 className=\"text-xl md:text-2xl font-bold text-blue-400\">2027 LOTTERY DRAW</h2>
                            </div>""",
          """                            <div className=\"text-center mb-6\">
                                <h1 className=\"text-4xl md:text-5xl font-black text-white mb-2\">In Cell We Trust</h1>
                                <h2 className=\"text-xl md:text-2xl font-bold text-blue-400\">2027 LOTTERY DRAW</h2>
                                <p className=\"text-blue-300 text-sm mt-2 font-semibold\">#1 finisher is guaranteed a top-5 draft pick.</p>
                            </div>""",
          'lottery rule disclosure')

          replace_once(
          """                                        {remaining.map(t => {
                                            const ballCount = getTeamBallCountInPool(t.id);
                                            const percentage = getTeamOddsInPool(t.id);

                                            return (""",
          """                                        {remaining.map(t => {
                                            const ballCount = getTeamBallCountInPool(t.id);
                                            const isGuaranteedTeam = topFiveGuaranteeActive && t.id === topFiveProtectedTeam?.id;
                                            const percentage = topFiveGuaranteeActive
                                                ? (isGuaranteedTeam ? '100.0' : '0.0')
                                                : getTeamOddsInPool(t.id);

                                            return (""",
          'live odds effective percentage')

          replace_once(
          """                                                            <div className=\"text-sm font-black text-blue-400\">{percentage}%</div>
                                                            <div className=\"text-[11px] text-gray-500 mt-0.5\">1 in {formatOneIn(ballCount, totalBalls)}</div>""",
          """                                                            <div className=\"text-sm font-black text-blue-400\">{percentage}%</div>
                                                            <div className=\"text-[11px] text-gray-500 mt-0.5\">
                                                                {topFiveGuaranteeActive
                                                                    ? (isGuaranteedTeam ? 'Guaranteed at Pick #5' : 'Not eligible for Pick #5')
                                                                    : `1 in ${formatOneIn(ballCount, totalBalls)}`}
                                                            </div>""",
          'live odds one-in')

          replace_once(
          """                                        <div>
                                            <h2 className=\"text-xl font-black text-white\">Live Odds</h2>
                                            <p className=\"text-xs text-gray-400\">Balls and percentage before next spin</p>
                                        </div>""",
          """                                        <div>
                                            <h2 className=\"text-xl font-black text-white\">Live Odds</h2>
                                            <p className=\"text-xs text-gray-400\">Balls and effective percentage before next spin</p>
                                            {topFiveGuaranteeActive && (
                                                <p className=\"text-xs text-blue-300 font-bold mt-1\">Top-5 guarantee is active for {topFiveProtectedTeam?.name}.</p>
                                            )}
                                        </div>""",
          'live odds guarantee notice')

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Guarantee #1 finisher a top-five draft pick"
          git rm .github/workflows/apply-top-five-guarantee.yml
          git commit -m "Remove one-time top-five guarantee workflow"
          git push
