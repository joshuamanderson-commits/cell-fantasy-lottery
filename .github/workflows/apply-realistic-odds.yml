name: Apply Realistic Odds Display Patch

on:
  push:
    paths:
      - '.github/workflows/apply-realistic-odds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lottery display and randomness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old = """            const buildBallPool = () => {\n                const pool = [];\n\n                teams.forEach(team => {\n                    for (let i = 0; i < getTotalBalls(team); i++) {\n                        pool.push(team.id);\n                    }\n                });\n\n                return pool;\n            };\n"""

          new = """            const getRandomIndex = (maxExclusive) => {\n                if (maxExclusive <= 0) return 0;\n\n                if (window.crypto?.getRandomValues) {\n                    const maxUint32 = 0x100000000;\n                    const limit = maxUint32 - (maxUint32 % maxExclusive);\n                    const values = new Uint32Array(1);\n                    let value;\n\n                    do {\n                        window.crypto.getRandomValues(values);\n                        value = values[0];\n                    } while (value >= limit);\n\n                    return value % maxExclusive;\n                }\n\n                return Math.floor(Math.random() * maxExclusive);\n            };\n\n            const shufflePool = (pool) => {\n                const shuffled = [...pool];\n\n                for (let i = shuffled.length - 1; i > 0; i--) {\n                    const j = getRandomIndex(i + 1);\n                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];\n                }\n\n                return shuffled;\n            };\n\n            const formatOneIn = (ballCount, totalBalls) => {\n                if (!ballCount || !totalBalls) return '—';\n                return (totalBalls / ballCount).toFixed(1);\n            };\n\n            const buildBallPool = () => {\n                const pool = [];\n\n                teams.forEach(team => {\n                    for (let i = 0; i < getTotalBalls(team); i++) {\n                        pool.push(team.id);\n                    }\n                });\n\n                return shufflePool(pool);\n            };\n"""

          if old not in s:
              raise SystemExit('buildBallPool block not found')
          s = s.replace(old, new, 1)

          s = s.replace('const randomIndex = Math.floor(Math.random() * pool.length);', 'const randomIndex = getRandomIndex(pool.length);')
          s = s.replace('const randomIndex = Math.floor(Math.random() * poolBeforePick.length);', 'const randomIndex = getRandomIndex(poolBeforePick.length);')
          s = s.replace('const randomIndex = Math.floor(Math.random() * tempPool.length);', 'const randomIndex = getRandomIndex(tempPool.length);')

          old_live = """                                                        <div className=\"text-right shrink-0\">\n                                                            <div className=\"text-sm font-black text-blue-400\">{percentage}%</div>\n                                                        </div>\n"""
          new_live = """                                                        <div className=\"text-right shrink-0\">\n                                                            <div className=\"text-sm font-black text-blue-400\">{percentage}%</div>\n                                                            <div className=\"text-[11px] text-gray-500 mt-0.5\">1 in {formatOneIn(ballCount, totalBalls)}</div>\n                                                        </div>\n"""
          if old_live not in s:
              raise SystemExit('live odds display block not found')
          s = s.replace(old_live, new_live, 1)

          old_modal = """                                            <div className=\"stat-card\">\n                                                <div className=\"text-xs text-gray-400 uppercase tracking-wide\">Chance For Pick</div>\n                                                <div className=\"text-3xl font-black text-blue-400\">{modalTeam.pickPercentage}%</div>\n                                            </div>\n"""
          new_modal = """                                            <div className=\"stat-card\">\n                                                <div className=\"text-xs text-gray-400 uppercase tracking-wide\">Chance For Pick</div>\n                                                <div className=\"text-3xl font-black text-blue-400\">{modalTeam.pickPercentage}%</div>\n                                                <div className=\"text-xs text-gray-500 mt-1\">About 1 in {formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}</div>\n                                            </div>\n"""
          if old_modal not in s:
              raise SystemExit('modal odds display block not found')
          s = s.replace(old_modal, new_modal, 1)

          old_table_head = """                                                        <th className=\"text-right py-3 px-3\">Expected</th>\n                                                        <th className=\"text-right py-3 px-3\">Simulated</th>\n"""
          new_table_head = """                                                        <th className=\"text-right py-3 px-3\">Expected</th>\n                                                        <th className=\"text-right py-3 px-3\">1 in</th>\n                                                        <th className=\"text-right py-3 px-3\">Simulated</th>\n"""
          if old_table_head in s:
              s = s.replace(old_table_head, new_table_head, 1)

          old_table_row = """                                                            <td className=\"text-right py-3 px-3 text-blue-400 font-bold\">{result.expectedPercentage.toFixed(2)}%</td>\n                                                            <td className=\"text-right py-3 px-3 text-white font-bold\">{result.simulatedPercentage.toFixed(2)}%</td>\n"""
          new_table_row = """                                                            <td className=\"text-right py-3 px-3 text-blue-400 font-bold\">{result.expectedPercentage.toFixed(2)}%</td>\n                                                            <td className=\"text-right py-3 px-3 text-gray-300\">1 in {formatOneIn(result.balls, oddsTestResults.totalBalls)}</td>\n                                                            <td className=\"text-right py-3 px-3 text-white font-bold\">{result.simulatedPercentage.toFixed(2)}%</td>\n"""
          if old_table_row in s:
              s = s.replace(old_table_row, new_table_row, 1)

          old_note = """                                        <p className=\"text-xs text-gray-500 mt-4\">Small differences are normal random variation. Re-running the test will produce slightly different simulated percentages each time.</p>\n"""
          new_note = """                                        <p className=\"text-xs text-gray-500 mt-4\">Small differences are normal random variation. The live draw and tester now use the browser's cryptographic random-number generator when available, and the visible wheel is shuffled so identical team balls are spread around the chamber.</p>\n"""
          if old_note in s:
              s = s.replace(old_note, new_note, 1)

          p.write_text(s)
          PY

          rm .github/workflows/apply-realistic-odds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-realistic-odds.yml
          git commit -m "Make lottery odds display more realistic and transparent"
          git push
