name: Apply Odds Tester Patch

on:
  push:
    paths:
      - '.github/workflows/apply-odds-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch lottery odds tester
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = """            const [editMode, setEditMode] = useState(false);\n            const [editPurchasesMode, setEditPurchasesMode] = useState(false);\n\n            const updateTeam = (id, field, value) => {\n                setTeams(teams.map(t => t.id === id ? { ...t, [field]: value } : t));\n            };\n"""
          new = """            const [editMode, setEditMode] = useState(false);\n            const [editPurchasesMode, setEditPurchasesMode] = useState(false);\n            const [oddsTestResults, setOddsTestResults] = useState(null);\n\n            const updateTeam = (id, field, value) => {\n                setTeams(teams.map(t => t.id === id ? { ...t, [field]: value } : t));\n                setOddsTestResults(null);\n            };\n"""
          assert old in text, 'state/updateTeam block not found'
          text = text.replace(old, new, 1)

          old = """            const startLottery = () => {\n                const pool = [];\n\n                teams.forEach(team => {\n                    for (let i = 0; i < getTotalBalls(team); i++) {\n                        pool.push(team.id);\n                    }\n                });\n\n                setCurrentBallPool(pool);\n                setSelectedPicks([]);\n                setWheelRotation(0);\n                setPhase('lottery');\n            };\n\n            const drawPick = () => {\n"""
          new = """            const buildBallPool = () => {\n                const pool = [];\n\n                teams.forEach(team => {\n                    for (let i = 0; i < getTotalBalls(team); i++) {\n                        pool.push(team.id);\n                    }\n                });\n\n                return pool;\n            };\n\n            const runOddsTest = () => {\n                const pool = buildBallPool();\n                const simulations = 10000;\n\n                if (pool.length === 0) {\n                    setOddsTestResults(null);\n                    return;\n                }\n\n                const winsByTeam = teams.reduce((acc, team) => {\n                    acc[team.id] = 0;\n                    return acc;\n                }, {});\n\n                for (let i = 0; i < simulations; i++) {\n                    const randomIndex = Math.floor(Math.random() * pool.length);\n                    winsByTeam[pool[randomIndex]] += 1;\n                }\n\n                const results = teams.map(team => {\n                    const balls = getTotalBalls(team);\n                    const expectedPercentage = (balls / pool.length) * 100;\n                    const simulatedPercentage = (winsByTeam[team.id] / simulations) * 100;\n\n                    return {\n                        id: team.id,\n                        name: team.name,\n                        position: team.position,\n                        balls,\n                        wins: winsByTeam[team.id],\n                        expectedPercentage,\n                        simulatedPercentage,\n                        difference: simulatedPercentage - expectedPercentage,\n                    };\n                });\n\n                setOddsTestResults({\n                    simulations,\n                    totalBalls: pool.length,\n                    results,\n                });\n            };\n\n            const startLottery = () => {\n                const pool = buildBallPool();\n\n                setCurrentBallPool(pool);\n                setSelectedPicks([]);\n                setWheelRotation(0);\n                setPhase('lottery');\n            };\n\n            const drawPick = () => {\n"""
          assert old in text, 'startLottery block not found'
          text = text.replace(old, new, 1)

          old = """            const editTeamName = (id, newName) => {\n                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));\n            };\n"""
          new = """            const editTeamName = (id, newName) => {\n                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));\n                setOddsTestResults(null);\n            };\n"""
          assert old in text, 'editTeamName block not found'
          text = text.replace(old, new, 1)

          marker = """                            <div className=\"flex gap-4\">\n                                <button onClick={() => setPhase('setup')} className=\"secondary-btn flex-1 py-3 px-4 rounded-xl font-bold\">Back</button>\n\n                                <button\n                                    onClick={startLottery}\n                                    disabled={teams.some(t => getTotalBalls(t) > 9)}\n                                    className=\"modern-btn flex-1 py-3 px-4 rounded-xl font-bold\"\n                                >\n                                    Start Lottery\n                                </button>\n                            </div>\n"""
          tester = """                            <div className=\"glass rounded-2xl p-6 mb-8\">\n                                <div className=\"flex flex-col md:flex-row md:items-center md:justify-between gap-4\">\n                                    <div>\n                                        <h3 className=\"text-lg font-bold text-white\">Odds Verification</h3>\n                                        <p className=\"text-sm text-gray-400 mt-1\">Run 10,000 invisible Pick #1 draws using the same random selection logic as the live lottery.</p>\n                                    </div>\n                                    <button onClick={runOddsTest} disabled={teams.some(t => getTotalBalls(t) > 9)} className=\"secondary-btn py-3 px-6 rounded-xl font-bold shrink-0\">\n                                        🧪 Test Odds — 10,000 Sims\n                                    </button>\n                                </div>\n\n                                {oddsTestResults && (\n                                    <div className=\"mt-6\">\n                                        <div className=\"grid grid-cols-2 gap-3 mb-4\">\n                                            <div className=\"stat-card\">\n                                                <div className=\"text-xs text-gray-400 uppercase tracking-wide\">Simulations</div>\n                                                <div className=\"text-2xl font-black text-white\">{oddsTestResults.simulations.toLocaleString()}</div>\n                                            </div>\n                                            <div className=\"stat-card\">\n                                                <div className=\"text-xs text-gray-400 uppercase tracking-wide\">Balls Tested</div>\n                                                <div className=\"text-2xl font-black text-blue-400\">{oddsTestResults.totalBalls}</div>\n                                            </div>\n                                        </div>\n\n                                        <div className=\"overflow-x-auto\">\n                                            <table className=\"w-full text-sm\">\n                                                <thead>\n                                                    <tr className=\"text-gray-400 border-b border-gray-800\">\n                                                        <th className=\"text-left py-3 pr-3\">Team</th>\n                                                        <th className=\"text-right py-3 px-3\">Balls</th>\n                                                        <th className=\"text-right py-3 px-3\">Expected</th>\n                                                        <th className=\"text-right py-3 px-3\">Simulated</th>\n                                                        <th className=\"text-right py-3 pl-3\">Difference</th>\n                                                    </tr>\n                                                </thead>\n                                                <tbody>\n                                                    {oddsTestResults.results.map(result => (\n                                                        <tr key={result.id} className=\"border-b border-gray-900\">\n                                                            <td className=\"py-3 pr-3\">\n                                                                <div className=\"flex items-center gap-2\">\n                                                                    <div className=\"w-3 h-3 rounded-full shrink-0\" style={{ backgroundColor: neonColors[result.id] }}></div>\n                                                                    <span className=\"font-bold text-white\">{result.name}</span>\n                                                                </div>\n                                                            </td>\n                                                            <td className=\"text-right py-3 px-3 text-gray-300\">{result.balls}</td>\n                                                            <td className=\"text-right py-3 px-3 text-blue-400 font-bold\">{result.expectedPercentage.toFixed(2)}%</td>\n                                                            <td className=\"text-right py-3 px-3 text-white font-bold\">{result.simulatedPercentage.toFixed(2)}%</td>\n                                                            <td className={`text-right py-3 pl-3 font-bold ${Math.abs(result.difference) <= 0.75 ? 'text-green-400' : 'text-yellow-400'}`}>\n                                                                {result.difference >= 0 ? '+' : ''}{result.difference.toFixed(2)}%\n                                                            </td>\n                                                        </tr>\n                                                    ))}\n                                                </tbody>\n                                            </table>\n                                        </div>\n                                        <p className=\"text-xs text-gray-500 mt-4\">Small differences are normal random variation. Re-running the test will produce slightly different simulated percentages each time.</p>\n                                    </div>\n                                )}\n                            </div>\n\n"""
          assert marker in text, 'purchase footer marker not found'
          text = text.replace(marker, tester + marker, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify patch
        run: |
          grep -q "Test Odds — 10,000 Sims" index.html
          grep -q "const runOddsTest" index.html
          grep -q "Expected" index.html
          grep -q "Simulated" index.html

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-odds-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-odds-test.yml
          git commit -m "Add 10,000-run lottery odds tester"
          git push origin HEAD:main
