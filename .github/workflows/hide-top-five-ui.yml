name: Hide Top Five Rule From UI

on:
  push:
    paths:
      - '.github/workflows/hide-top-five-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove visible top-five rule references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
              ("const pickPercentage = topFiveGuaranteeApplied ? '100.0' : (pickTotalBalls > 0 ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1) : '0.0');",
               "const pickPercentage = pickTotalBalls > 0 ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1) : '0.0';"),
              ("                const topFiveProtectedTeam = getTopFiveProtectedTeam();\n                const topFiveGuaranteeActive = isTopFiveGuaranteeActive(nextPickNumber, currentBallPool);\n", ""),
              ("                                <p className=\"text-blue-300 text-sm mt-2 font-semibold\">#1 finisher is guaranteed a top-5 draft pick.</p>\n", ""),
              ("                                                <div className=\"text-xs text-gray-500 mt-1\">\n                                                    {modalTeam.topFiveGuaranteeApplied ? 'Guaranteed by league rule' : `About 1 in ${formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}`}\n                                                </div>",
               "                                                <div className=\"text-xs text-gray-500 mt-1\">About 1 in {formatOneIn(modalTeam.pickBallCount, modalTeam.pickTotalBalls)}</div>"),
              ("                                            const isGuaranteedTeam = topFiveGuaranteeActive && t.id === topFiveProtectedTeam?.id;\n                                            const percentage = topFiveGuaranteeActive ? (isGuaranteedTeam ? '100.0' : '0.0') : getTeamOddsInPool(t.id);",
               "                                            const percentage = getTeamOddsInPool(t.id);"),
              ("                                                            <div className=\"text-[11px] text-gray-500 mt-0.5\">\n                                                                {topFiveGuaranteeActive ? (isGuaranteedTeam ? 'Guaranteed at Pick #5' : 'Not eligible for Pick #5') : `1 in ${formatOneIn(ballCount, totalBalls)}`}\n                                                            </div>",
               "                                                            <div className=\"text-[11px] text-gray-500 mt-0.5\">1 in {formatOneIn(ballCount, totalBalls)}</div>"),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected UI block: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep top-five protection backend-only"
          git rm .github/workflows/hide-top-five-ui.yml
          git commit -m "Remove one-time UI cleanup workflow"
          git push
