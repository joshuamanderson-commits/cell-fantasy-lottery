<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Cell We Trust - 2027 Lottery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #0f1012;
            color: #f5f5f5;
        }

        .glass {
            background: rgba(29, 32, 33, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #2a2e2f;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .pie-svg {
            transform-origin: center;
            will-change: transform;
        }

        @keyframes spinWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pie-svg.spinning {
            animation: spinWheel 1s linear infinite;
        }

        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #0d8cff;
            z-index: 10;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            border-right: 1px solid rgba(0, 0, 0, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #1d2021 0%, #202324 100%);
            border: 2px solid #0d8cff;
            padding: 2px;
            border-radius: 24px;
            animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(13, 140, 255, 0.2);
        }

        @keyframes modalPop {
            0% { transform: scale(0.3) rotateZ(-10deg); opacity: 0; }
            100% { transform: scale(1) rotateZ(0deg); opacity: 1; }
        }

        .modal-inner {
            background: #0f1012;
            padding: 50px 40px;
            border-radius: 22px;
            text-align: center;
        }

        .pick-number-large {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #0d8cff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -4px;
        }

        .team-name-large {
            font-size: 56px;
            font-weight: 900;
            color: #f5f5f5;
            margin: 20px 0;
        }

        .modal-button {
            background: linear-gradient(135deg, #0d8cff 0%, #38bdf8 100%);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(13, 140, 255, 0.3);
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(13, 140, 255, 0.4);
        }

        .modern-btn {
            background: linear-gradient(135deg, #0d8cff 0%, #1d9bff 100%);
            color: #fff;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(13, 140, 255, 0.2);
            border-radius: 50px;
        }

        .modern-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 140, 255, 0.3);
        }

        .modern-btn:disabled {
            background: #3a4041;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        .secondary-btn {
            background: #202324;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            border-radius: 50px;
            font-weight: 600;
        }

        .secondary-btn:hover {
            background: #2a2e2f;
            color: #f5f5f5;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .pill-button {
            background: #202324;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill-button:hover {
            background: #2a2e2f;
            color: #f5f5f5;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .pill-button.active {
            background: #0d8cff;
            color: #fff;
            border-color: #0d8cff;
        }

    </style>
</head>
<body style="margin:0; padding:0;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SoundManager = {
            playPick: () => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            },

            playWin: () => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4 + i * 0.1);
                    osc.start(audioContext.currentTime + i * 0.1);
                    osc.stop(audioContext.currentTime + 0.4 + i * 0.1);
                });
            },
        };

        const neonColors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
            '#F8B88B', '#A8E6CF', '#FFD3B6', '#FFAAA5',
            '#AA96DA', '#FCBAD3', '#A8D5BA', '#FFD6BA'
        ];

        function WheelOfFortune({ teams, currentBallPool, isSpinning, isLanding, wheelRotation }) {
            const remaining = teams.filter(t => currentBallPool.includes(t.id));

            return (
                <svg
                    className={`pie-svg ${isSpinning && !isLanding ? 'spinning' : ''}`}
                    viewBox="0 0 200 200"
                    style={{ transform: `rotate(${wheelRotation}deg)`, transition: isLanding ? 'transform 2s cubic-bezier(0.25, 0.46, 0.45, 0.94)' : 'none' }}
                >
                    {remaining.map((team, idx) => {
                        const angle = (360 / remaining.length) * idx;
                        const nextAngle = (360 / remaining.length) * (idx + 1);
                        const startRad = (angle * Math.PI) / 180;
                        const endRad = (nextAngle * Math.PI) / 180;

                        const x1 = 100 + 90 * Math.cos(startRad);
                        const y1 = 100 + 90 * Math.sin(startRad);
                        const x2 = 100 + 90 * Math.cos(endRad);
                        const y2 = 100 + 90 * Math.sin(endRad);

                        const largeArc = (nextAngle - angle) > 180 ? 1 : 0;

                        const pathData = [
                            `M 100 100`,
                            `L ${x1} ${y1}`,
                            `A 90 90 0 ${largeArc} 1 ${x2} ${y2}`,
                            `Z`
                        ].join(' ');

                        return (
                            <g key={team.id}>
                                <path
                                    d={pathData}
                                    fill={neonColors[team.id]}
                                    stroke="#000"
                                    strokeWidth="1"
                                />
                                {360 / remaining.length > 15 && (
                                    <text
                                        x={100 + 60 * Math.cos(((angle + nextAngle) / 2 * Math.PI) / 180)}
                                        y={100 + 60 * Math.sin(((angle + nextAngle) / 2 * Math.PI) / 180)}
                                        textAnchor="middle"
                                        dominantBaseline="middle"
                                        fill="#fff"
                                        fontSize="10"
                                        fontWeight="bold"
                                        textShadow="1px 1px 2px rgba(0,0,0,0.8)"
                                    >
                                        {team.abbr}
                                    </text>
                                )}
                            </g>
                        );
                    })}
                </svg>
            );
        }

        function App() {
            const [phase, setPhase] = useState('setup');
            const [entryAmount, setEntryAmount] = useState(150);
            const [teams, setTeams] = useState([
                { id: 0, name: 'Lmartin', abbr: 'LM', position: 1, baseBalls: 6, purchasedBalls: 0, maxPurchase: 2, discountPrice: 7.50, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 1, name: 'Mo', abbr: 'MO', position: 2, baseBalls: 5, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 2, name: 'Lyfe', abbr: 'LYF', position: 3, baseBalls: 4, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 3, name: 'Cell', abbr: 'CEL', position: 4, baseBalls: 3, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 4, name: 'Jawn', abbr: 'JAW', position: 5, baseBalls: 3, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 5, name: 'Pizz', abbr: 'PIZ', position: 6, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 6, name: 'Sleeze', abbr: 'SLZ', position: 7, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 7, name: 'Rose', abbr: 'ROS', position: 8, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 8, name: 'Brian', abbr: 'BRI', position: 9, baseBalls: 2, purchasedBalls: 0, maxPurchase: 3, discountPrice: 7.50, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: true },
                { id: 9, name: 'Chase', abbr: 'CHA', position: 10, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 10, name: 'Packy', abbr: 'PAC', position: 11, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 11, name: 'Jdp', abbr: 'JDP', position: 12, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 12, name: 'Bookie', abbr: 'BOO', position: 13, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 13, name: 'Dennis', abbr: 'DEN', position: 14, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 14, name: 'Teezy', abbr: 'TEE', position: 15, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 15, name: 'Dee', abbr: 'DEE', position: 16, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
            ]);
            const [selectedPicks, setSelectedPicks] = useState([]);
            const [currentBallPool, setCurrentBallPool] = useState([]);
            const [isSpinning, setIsSpinning] = useState(false);
            const [wheelRotation, setWheelRotation] = useState(0);
            const [showModal, setShowModal] = useState(false);
            const [modalTeam, setModalTeam] = useState(null);
            const [modalPickNumber, setModalPickNumber] = useState(0);
            const [isLanding, setIsLanding] = useState(false);
            const [editMode, setEditMode] = useState(false);
            const [editPurchasesMode, setEditPurchasesMode] = useState(false);

            const updateTeam = (id, field, value) => {
                setTeams(teams.map(t => t.id === id ? { ...t, [field]: value } : t));
            };

            const getTotalBalls = (team) => {
                return team.baseBalls + team.purchasedBalls + team.replacementBonus;
            };

            const getPurchaseCost = (team) => {
                let cost = 0;
                for (let i = 0; i < team.purchasedBalls; i++) {
                    cost += (team.discountPrice && i < 2) ? team.discountPrice : team.standardPrice;
                }
                return cost;
            };

            const startLottery = () => {
                const pool = [];
                teams.forEach(team => {
                    for (let i = 0; i < getTotalBalls(team); i++) {
                        pool.push(team.id);
                    }
                });
                setCurrentBallPool(pool);
                setSelectedPicks([]);
                setWheelRotation(0);
                setPhase('lottery');
            };

            const drawPick = () => {
                if (currentBallPool.length === 0 || isSpinning) return;

                SoundManager.playPick();
                setIsSpinning(true);
                setIsLanding(false);

                const randomIndex = Math.floor(Math.random() * currentBallPool.length);
                const selectedId = currentBallPool[randomIndex];
                const selectedTeam = teams.find(t => t.id === selectedId);

                const remaining = teams.filter(t => currentBallPool.includes(t.id));
                const segmentAngle = 360 / remaining.length;
                const selectedTeamIndex = remaining.findIndex(t => t.id === selectedId);
                const teamCenterAngle = selectedTeamIndex * segmentAngle + segmentAngle / 2;
                const pointerAngle = 270; // Top of wheel in math angle convention
                const targetRotation = pointerAngle - teamCenterAngle;
                const spins = 8;
                const finalRotation = spins * 360 + targetRotation;

                // Spin for 4 seconds, then transition to landing
                setTimeout(() => {
                    setIsLanding(true);
                    setWheelRotation(finalRotation);
                }, 4000);

                // Show result after landing animation (4s spin + 2s landing)
                setTimeout(() => {
                    SoundManager.playWin();
                    setModalTeam(selectedTeam);
                    setModalPickNumber(selectedPicks.length + 1);
                    setShowModal(true);
                    setIsSpinning(false);
                    setIsLanding(false);
                }, 6200);
            };

            const confirmPick = () => {
                setShowModal(false);
                setSelectedPicks([...selectedPicks, modalTeam]);
                setCurrentBallPool(currentBallPool.filter(id => id !== modalTeam.id));
            };

            const simulateAllPicks = () => {
                if (isSpinning || currentBallPool.length === 0) return;

                // Generate all remaining picks at once
                const allPicks = [...selectedPicks];
                let tempPool = [...currentBallPool];

                while (tempPool.length > 0) {
                    const randomIndex = Math.floor(Math.random() * tempPool.length);
                    const selectedId = tempPool[randomIndex];
                    const selectedTeam = teams.find(t => t.id === selectedId);
                    allPicks.push(selectedTeam);
                    tempPool = tempPool.filter(id => id !== selectedId);
                }

                // Update state and navigate to results
                setSelectedPicks(allPicks);
                setCurrentBallPool([]);
                setIsSpinning(false);
                setIsLanding(false);
                setPhase('results');
            };

            const reset = () => {
                setSelectedPicks([]);
                setCurrentBallPool([]);
                setIsSpinning(false);
                setIsLanding(false);
                setShowModal(false);
                setModalTeam(null);
                setWheelRotation(0);
                setEditMode(false);
                setPhase('setup');
            };

            const editPickName = (index, newName) => {
                const updated = [...selectedPicks];
                updated[index] = { ...updated[index], name: newName };
                setSelectedPicks(updated);
            };

            const movePickUp = (index) => {
                if (index === 0) return;
                const updated = [...selectedPicks];
                [updated[index - 1], updated[index]] = [updated[index], updated[index - 1]];
                setSelectedPicks(updated);
            };

            const movePickDown = (index) => {
                if (index === selectedPicks.length - 1) return;
                const updated = [...selectedPicks];
                [updated[index], updated[index + 1]] = [updated[index + 1], updated[index]];
                setSelectedPicks(updated);
            };

            const editTeamName = (id, newName) => {
                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
            };

            const totalRevenue = teams.reduce((sum, t) => sum + getPurchaseCost(t), 0);
            const leaguePot = (entryAmount * 16) + totalRevenue;

            // SETUP PHASE
            if (phase === 'setup') {
                return (
                    <div className="min-h-screen p-6 md:p-12">
                        <div className="max-w-2xl mx-auto">
                            <div className="text-center mb-12">
                                <h1 className="text-6xl md:text-7xl font-black text-white mb-4">In Cell We Trust</h1>
                                <h2 className="text-3xl font-bold text-blue-400 mb-4">
                                    2027 LOTTERY
                                </h2>
                                <p className="text-gray-400 text-lg">Fantasy Draft Setup</p>
                            </div>

                            <div className="glass rounded-3xl p-8">
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-white font-bold mb-3 text-lg">Entry Amount per Team ($)</label>
                                        <input
                                            type="number"
                                            value={entryAmount}
                                            onChange={(e) => setEntryAmount(parseFloat(e.target.value))}
                                            className="w-full px-6 py-4 bg-gray-900 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 text-lg"
                                        />
                                        <p className="text-gray-400 text-sm mt-2">League Pot: ${(entryAmount * 16).toFixed(2)}</p>
                                    </div>

                                    <button
                                        onClick={() => setPhase('purchases')}
                                        className="modern-btn w-full py-4 px-6 rounded-xl text-lg font-bold"
                                    >
                                        Proceed to Ball Purchases
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // PURCHASES PHASE
            if (phase === 'purchases') {
                return (
                    <div className="min-h-screen p-6 md:p-12">
                        <div className="max-w-7xl mx-auto">
                            <div className="text-center mb-12">
                                <h1 className="text-5xl font-black text-white mb-2">In Cell We Trust</h1>
                                <h2 className="text-2xl font-bold text-blue-400 mb-2">
                                    BALL PURCHASES
                                </h2>
                                <p className="text-gray-400">Entry: ${entryAmount.toFixed(2)} × 16 teams</p>
                            </div>

                            <button
                                onClick={() => setEditPurchasesMode(!editPurchasesMode)}
                                className={`w-full mb-4 font-bold py-2 px-4 rounded-xl transition ${editPurchasesMode ? 'modern-btn' : 'secondary-btn'}`}
                            >
                                {editPurchasesMode ? '✓ Done Editing' : '✎ Edit Team Names'}
                            </button>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                                {teams.map(t => {
                                    const totalBalls = getTotalBalls(t);
                                    const cost = getPurchaseCost(t);
                                    const tooMany = totalBalls > 9;

                                    return (
                                        <div key={t.id} className={`glass rounded-2xl p-5 ${tooMany ? 'border-red-500/20' : ''}`}>
                                            <div className="space-y-3">
                                                <div>
                                                    {editPurchasesMode ? (
                                                        <input
                                                            type="text"
                                                            value={t.name}
                                                            onChange={(e) => editTeamName(t.id, e.target.value)}
                                                            className="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white font-bold mb-2 focus:outline-none focus:border-blue-500"
                                                        />
                                                    ) : (
                                                        <div className="font-bold text-lg text-white">{t.name}</div>
                                                    )}
                                                    <div className="text-xs text-gray-400">#{t.position} {t.isTBWinner ? '(TB Winner)' : ''}</div>
                                                </div>

                                                <div className="bg-gray-900 rounded-lg p-3 border border-gray-800">
                                                    <div className="text-xs text-gray-400">Base Balls</div>
                                                    {editPurchasesMode ? (
                                                        <div className="flex items-center gap-2 mt-2">
                                                            <button onClick={() => updateTeam(t.id, 'baseBalls', Math.max(0, t.baseBalls - 1))} className="pill-button">−</button>
                                                            <input type="number" min="0" value={t.baseBalls} onChange={(e) => updateTeam(t.id, 'baseBalls', Math.max(0, parseInt(e.target.value) || 0))} className="flex-1 px-2 py-1 bg-gray-800 border border-gray-700 rounded text-white text-center font-bold text-sm" />
                                                            <button onClick={() => updateTeam(t.id, 'baseBalls', t.baseBalls + 1)} className="pill-button">+</button>
                                                        </div>
                                                    ) : (
                                                        <div className="text-2xl font-black text-blue-400">{t.baseBalls}</div>
                                                    )}
                                                </div>

                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-2">Purchase (0-{t.maxPurchase})</label>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => updateTeam(t.id, 'purchasedBalls', Math.max(0, t.purchasedBalls - 1))} className="pill-button">−</button>
                                                        <input type="number" min="0" max={t.maxPurchase} value={t.purchasedBalls} onChange={(e) => updateTeam(t.id, 'purchasedBalls', Math.min(t.maxPurchase, Math.max(0, parseInt(e.target.value) || 0)))} className="flex-1 px-3 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white text-center font-bold text-sm" />
                                                        <button onClick={() => updateTeam(t.id, 'purchasedBalls', Math.min(t.maxPurchase, t.purchasedBalls + 1))} className="pill-button">+</button>
                                                    </div>
                                                    <div className="text-xs text-gray-400 mt-1">${cost.toFixed(2)}</div>
                                                </div>

                                                <div className={`rounded-lg p-3 border ${tooMany ? 'border-red-500/30 bg-red-500/10' : 'border-gray-800 bg-gray-900'}`}>
                                                    <div className="text-xs text-gray-400">Total</div>
                                                    <div className={`text-2xl font-black ${tooMany ? 'text-red-400' : 'text-blue-400'}`}>{totalBalls}/9</div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="glass rounded-2xl p-6 mb-8">
                                <h3 className="text-lg font-bold text-white mb-4">Summary</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-gray-900 rounded-lg p-4 border border-gray-800">
                                        <div className="text-xs text-gray-400">Total Balls</div>
                                        <div className="text-2xl font-bold text-blue-400">{teams.reduce((sum, t) => sum + getTotalBalls(t), 0)}</div>
                                    </div>
                                    <div className="bg-gray-900 rounded-lg p-4 border border-gray-800">
                                        <div className="text-xs text-gray-400">Ball Revenue</div>
                                        <div className="text-2xl font-bold text-white">${totalRevenue.toFixed(2)}</div>
                                    </div>
                                    <div className="bg-gray-900 rounded-lg p-4 border border-gray-800">
                                        <div className="text-xs text-gray-400">Entry Pot</div>
                                        <div className="text-2xl font-bold text-white">${(entryAmount * 16).toFixed(2)}</div>
                                    </div>
                                    <div className="bg-gray-900 rounded-lg p-4 border border-gray-800">
                                        <div className="text-xs text-gray-400">Total Pot</div>
                                        <div className="text-2xl font-bold text-blue-400">${leaguePot.toFixed(2)}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4">
                                <button onClick={() => setPhase('setup')} className="secondary-btn flex-1 py-3 px-4 rounded-xl font-bold">Back</button>
                                <button onClick={startLottery} disabled={teams.some(t => getTotalBalls(t) > 9)} className="modern-btn flex-1 py-3 px-4 rounded-xl font-bold">Start Lottery</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // LOTTERY PHASE
            if (phase === 'lottery') {
                const remaining = teams.filter(t => currentBallPool.includes(t.id));
                const totalBalls = currentBallPool.length;

                return (
                    <div className="min-h-screen p-6 md:p-12">
                        {showModal && modalTeam && (
                            <div className="modal-overlay">
                                <div className="modal-content">
                                    <div className="modal-inner">
                                        <div className="pick-number-large">{modalPickNumber}</div>
                                        <div className="team-name-large">{modalTeam.name}</div>
                                        <div className="text-lg text-blue-400 font-bold">PICK #{modalPickNumber}</div>
                                        <button onClick={confirmPick} className="modal-button">Next Pick</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="max-w-7xl mx-auto">
                            <div className="text-center mb-8">
                                <h1 className="text-5xl font-black text-white mb-2">In Cell We Trust</h1>
                                <h2 className="text-2xl font-bold text-blue-400">LOTTERY DRAW</h2>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                {/* Odds Panel */}
                                <div className="glass rounded-2xl p-6">
                                    <h2 className="text-xl font-bold text-white mb-4">ODDS</h2>
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {remaining.map(t => {
                                            const ballCount = currentBallPool.filter(id => id === t.id).length;
                                            const percentage = ((ballCount / totalBalls) * 100).toFixed(1);
                                            return (
                                                <div key={t.id} className="bg-gray-900 rounded-lg p-3 border border-gray-800">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <div className="w-3 h-3 rounded" style={{backgroundColor: neonColors[t.id]}}></div>
                                                        <div className="font-bold text-xs text-gray-300">{t.name}</div>
                                                    </div>
                                                    <div className="text-lg font-black text-blue-400 ml-5">{percentage}%</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Wheel */}
                                <div className="lg:col-span-2">
                                    <div className="glass rounded-2xl p-8">
                                        <h2 className="text-2xl font-black text-center text-blue-400 mb-8">THE LOTTERY CHAMBER</h2>

                                        <div className="wheel-container">
                                            <div className="pointer"></div>
                                            <div className="wheel">
                                                <WheelOfFortune
                                                    teams={teams}
                                                    currentBallPool={currentBallPool}
                                                    isSpinning={isSpinning}
                                                    isLanding={isLanding}
                                                    wheelRotation={wheelRotation}
                                                />
                                            </div>
                                        </div>

                                        <div className="flex gap-3 mt-8">
                                            <button
                                                onClick={drawPick}
                                                disabled={currentBallPool.length === 0 || isSpinning}
                                                className={`flex-1 font-bold py-4 px-6 rounded-xl text-lg transition ${currentBallPool.length > 0 && !isSpinning ? 'modern-btn' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
                                            >
                                                {isSpinning ? '⏳ SPINNING...' : currentBallPool.length > 0 ? '🎲 SPIN' : 'DONE'}
                                            </button>
                                            <button
                                                onClick={simulateAllPicks}
                                                disabled={currentBallPool.length === 0 || isSpinning}
                                                className={`flex-1 font-bold py-4 px-6 rounded-xl text-lg transition ${currentBallPool.length > 0 && !isSpinning ? 'secondary-btn' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
                                            >
                                                ⚡ FINISH
                                            </button>
                                        </div>

                                        <p className="text-center text-gray-400 mt-4 font-bold">{currentBallPool.length} balls remaining</p>
                                    </div>
                                </div>

                                {/* Draft Order */}
                                <div className="glass rounded-2xl p-6 h-fit">
                                    <h2 className="text-xl font-bold text-white mb-4">Draft Order</h2>
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {selectedPicks.length === 0 ? (
                                            <div className="text-gray-400 text-center py-8 text-sm">Waiting for first spin...</div>
                                        ) : (
                                            selectedPicks.map((t, i) => (
                                                <div key={i} className="bg-gray-900 rounded-lg p-3 border border-gray-800 flex items-center gap-3">
                                                    <div className="bg-blue-500 rounded-full w-7 h-7 flex items-center justify-center font-bold text-white text-xs">{i + 1}</div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="font-bold text-white text-sm truncate">{t.name}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    {selectedPicks.length > 0 && <button onClick={() => setPhase('results')} className="w-full mt-4 modern-btn font-bold py-2 rounded-lg text-sm">View Results</button>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RESULTS PHASE
            if (phase === 'results') {
                if (selectedPicks.length === 0) {
                    return (
                        <div className="min-h-screen p-6 md:p-12 flex items-center justify-center">
                            <div className="text-center">
                                <h1 className="text-5xl font-black text-white mb-4">In Cell We Trust</h1>
                                <p className="text-2xl text-blue-400 mb-8">No picks yet</p>
                                <button onClick={() => setPhase('lottery')} className="modern-btn font-bold py-3 px-8 rounded-xl">← Back to Lottery</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen p-6 md:p-12">
                        <div className="max-w-4xl mx-auto">
                            <div className="text-center mb-8">
                                <h1 className="text-5xl font-black text-white mb-2">In Cell We Trust</h1>
                                <h2 className="text-2xl font-bold text-blue-400 mb-2">2027 DRAFT ORDER</h2>
                                <p className="text-gray-400">Final Lottery Results</p>
                            </div>

                            <button
                                onClick={() => setEditMode(!editMode)}
                                className={`w-full mb-4 font-bold py-2 px-4 rounded-xl transition ${editMode ? 'modern-btn' : 'secondary-btn'}`}
                            >
                                {editMode ? '✓ Done Editing' : '✎ Edit Names & Order'}
                            </button>

                            <div className="glass rounded-2xl p-8 mb-8">
                                <div className="space-y-3">
                                    {selectedPicks.map((t, i) => {
                                        const totalBalls = getTotalBalls(t);
                                        return (
                                            <div key={i} className="bg-gray-900 rounded-lg p-4 border border-gray-800 flex items-center gap-3">
                                                <div className="bg-blue-500 rounded-full w-10 h-10 flex items-center justify-center font-black text-white text-sm">{i + 1}</div>
                                                {editMode ? (
                                                    <>
                                                        <input
                                                            type="text"
                                                            value={t.name}
                                                            onChange={(e) => editPickName(i, e.target.value)}
                                                            className="flex-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white font-bold focus:outline-none focus:border-blue-500"
                                                        />
                                                        <div className="flex gap-1">
                                                            <button
                                                                onClick={() => movePickUp(i)}
                                                                disabled={i === 0}
                                                                className="pill-button disabled:opacity-40 disabled:cursor-not-allowed"
                                                            >
                                                                ↑
                                                            </button>
                                                            <button
                                                                onClick={() => movePickDown(i)}
                                                                disabled={i === selectedPicks.length - 1}
                                                                className="pill-button disabled:opacity-40 disabled:cursor-not-allowed"
                                                            >
                                                                ↓
                                                            </button>
                                                        </div>
                                                    </>
                                                ) : (
                                                    <div className="flex-1">
                                                        <div className="text-xl font-bold text-white">{t.name}</div>
                                                        <div className="text-gray-400 text-sm">Had {totalBalls} balls</div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="bg-gray-900 rounded-lg p-6 border border-gray-800 mt-8">
                                    <h3 className="text-lg font-bold text-white mb-4">Summary</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div>
                                            <div className="text-xs text-gray-400">Total Balls</div>
                                            <div className="text-2xl font-bold text-blue-400">{teams.reduce((sum, t) => sum + getTotalBalls(t), 0)}</div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-gray-400">Entry Pot</div>
                                            <div className="text-2xl font-bold text-white">${(entryAmount * 16).toFixed(2)}</div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-gray-400">Ball Revenue</div>
                                            <div className="text-2xl font-bold text-white">${totalRevenue.toFixed(2)}</div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-gray-400">Total Pot</div>
                                            <div className="text-2xl font-bold text-blue-400">${leaguePot.toFixed(2)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-3">
                                {selectedPicks.length < 16 && (
                                    <button onClick={() => setPhase('lottery')} className="flex-1 secondary-btn font-bold py-3 px-4 rounded-xl">← Back to Lottery</button>
                                )}
                                <button onClick={reset} className="flex-1 modern-btn font-bold py-3 px-4 rounded-xl">↻ New Lottery</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Fallback if no phase matches
            return (
                <div className="min-h-screen p-6 md:p-12 flex items-center justify-center bg-gray-900">
                    <div className="text-center text-white">
                        <h1 className="text-4xl font-bold mb-4">Error</h1>
                        <p className="text-xl mb-4">Current phase: {phase}</p>
                        <button
                            onClick={() => setPhase('setup')}
                            className="modern-btn font-bold py-3 px-8 rounded-xl"
                        >
                            Reset to Setup
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
