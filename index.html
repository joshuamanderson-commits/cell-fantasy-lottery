<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Cell We Trust - 2027 Lottery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background: #0f1012;
            color: #f5f5f5;
        }

        .glass {
            background: rgba(29, 32, 33, 0.82);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #2a2e2f;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            background: #111827;
        }

        .pie-svg {
            transform-origin: center;
            will-change: transform;
        }

        @keyframes spinWheel {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .pie-svg.spinning {
            animation: spinWheel 1s linear infinite;
        }

        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #0d8cff;
            z-index: 10;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        .center-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 58px;
            height: 58px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #38bdf8 0%, #0d8cff 55%, #082f49 100%);
            border: 4px solid #0f1012;
            border-radius: 999px;
            z-index: 9;
            box-shadow: 0 0 24px rgba(13, 140, 255, 0.55);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            animation: fadeIn 0.3s ease;
            padding: 16px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: linear-gradient(135deg, #1d2021 0%, #202324 100%);
            border: 2px solid #0d8cff;
            padding: 2px;
            border-radius: 24px;
            animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(13, 140, 255, 0.2);
            width: min(100%, 560px);
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.3) rotateZ(-10deg);
                opacity: 0;
            }

            100% {
                transform: scale(1) rotateZ(0deg);
                opacity: 1;
            }
        }

        .modal-inner {
            background: #0f1012;
            padding: 46px 34px;
            border-radius: 22px;
            text-align: center;
        }

        .pick-number-large {
            font-size: clamp(72px, 20vw, 120px);
            font-weight: 900;
            background: linear-gradient(135deg, #0d8cff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -4px;
            line-height: 1;
        }

        .team-name-large {
            font-size: clamp(36px, 12vw, 56px);
            font-weight: 900;
            color: #f5f5f5;
            margin: 18px 0;
            word-break: break-word;
        }

        .modal-button {
            background: linear-gradient(135deg, #0d8cff 0%, #38bdf8 100%);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 28px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(13, 140, 255, 0.3);
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(13, 140, 255, 0.4);
        }

        .modern-btn {
            background: linear-gradient(135deg, #0d8cff 0%, #1d9bff 100%);
            color: #fff;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(13, 140, 255, 0.2);
            border-radius: 50px;
        }

        .modern-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 140, 255, 0.3);
        }

        .modern-btn:disabled {
            background: #3a4041;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        .secondary-btn {
            background: #202324;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            border-radius: 50px;
            font-weight: 600;
        }

        .secondary-btn:hover {
            background: #2a2e2f;
            color: #f5f5f5;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .pill-button {
            background: #202324;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill-button:hover {
            background: #2a2e2f;
            color: #f5f5f5;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .stat-card {
            background: rgba(15, 16, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
        }

        .odds-row {
            background: rgba(15, 16, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
        }

        .mini-bar {
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .mini-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #0d8cff 0%, #38bdf8 100%);
        }

        @media (max-width: 480px) {
            .wheel-container {
                width: 300px;
                height: 300px;
            }

            .modal-inner {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body style="margin:0; padding:0;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SoundManager = {
            playPick: () => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            },

            playWin: () => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50];

                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.2, audioContext.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4 + i * 0.1);

                    osc.start(audioContext.currentTime + i * 0.1);
                    osc.stop(audioContext.currentTime + 0.4 + i * 0.1);
                });
            },
        };

        const neonColors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
            '#F8B88B', '#A8E6CF', '#FFD3B6', '#FFAAA5',
            '#AA96DA', '#FCBAD3', '#A8D5BA', '#FFD6BA'
        ];

        function WheelOfFortune({ teams, currentBallPool, isSpinning, isLanding, wheelRotation }) {
            const ballSegments = currentBallPool.map((teamId, ballIndex) => {
                const team = teams.find(t => t.id === teamId);

                return {
                    teamId,
                    ballIndex,
                    team,
                };
            }).filter(segment => segment.team);

            return (
                <svg
                    className={`pie-svg ${isSpinning && !isLanding ? 'spinning' : ''}`}
                    viewBox="0 0 200 200"
                    style={{
                        transform: `rotate(${wheelRotation}deg)`,
                        transition: isLanding ? 'transform 2s cubic-bezier(0.25, 0.46, 0.45, 0.94)' : 'none'
                    }}
                >
                    {ballSegments.map((segment, idx) => {
                        const angle = (360 / ballSegments.length) * idx;
                        const nextAngle = (360 / ballSegments.length) * (idx + 1);
                        const startRad = (angle * Math.PI) / 180;
                        const endRad = (nextAngle * Math.PI) / 180;

                        const x1 = 100 + 90 * Math.cos(startRad);
                        const y1 = 100 + 90 * Math.sin(startRad);
                        const x2 = 100 + 90 * Math.cos(endRad);
                        const y2 = 100 + 90 * Math.sin(endRad);

                        const largeArc = (nextAngle - angle) > 180 ? 1 : 0;

                        const pathData = [
                            `M 100 100`,
                            `L ${x1} ${y1}`,
                            `A 90 90 0 ${largeArc} 1 ${x2} ${y2}`,
                            `Z`
                        ].join(' ');

                        const labelAngle = (angle + nextAngle) / 2;
                        const labelRad = (labelAngle * Math.PI) / 180;

                        return (
                            <g key={`${segment.teamId}-${segment.ballIndex}-${idx}`}>
                                <path
                                    d={pathData}
                                    fill={neonColors[segment.teamId]}
                                    stroke="#000"
                                    strokeWidth="0.55"
                                />

                                {360 / ballSegments.length > 8 && (
                                    <text
                                        x={100 + 62 * Math.cos(labelRad)}
                                        y={100 + 62 * Math.sin(labelRad)}
                                        textAnchor="middle"
                                        dominantBaseline="middle"
                                        fill="#fff"
                                        fontSize={ballSegments.length > 32 ? "6" : "8"}
                                        fontWeight="bold"
                                    >
                                        {segment.team.abbr}
                                    </text>
                                )}
                            </g>
                        );
                    })}
                </svg>
            );
        }

        function App() {
            const [phase, setPhase] = useState('setup');
            const [entryAmount, setEntryAmount] = useState(150);

            const [teams, setTeams] = useState([
                { id: 0, name: 'Lmartin', abbr: 'LM', position: 1, baseBalls: 6, purchasedBalls: 0, maxPurchase: 2, discountPrice: 7.50, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 1, name: 'Mo', abbr: 'MO', position: 2, baseBalls: 5, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 2, name: 'Lyfe', abbr: 'LYF', position: 3, baseBalls: 4, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 3, name: 'Cell', abbr: 'CEL', position: 4, baseBalls: 3, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 4, name: 'Jawn', abbr: 'JAW', position: 5, baseBalls: 3, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 5, name: 'Pizz', abbr: 'PIZ', position: 6, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 6, name: 'Sleeze', abbr: 'SLZ', position: 7, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 7, name: 'Rose', abbr: 'ROS', position: 8, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 8, name: 'Brian', abbr: 'BRI', position: 9, baseBalls: 2, purchasedBalls: 0, maxPurchase: 3, discountPrice: 7.50, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: true },
                { id: 9, name: 'Chase', abbr: 'CHA', position: 10, baseBalls: 2, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 10, name: 'Packy', abbr: 'PAC', position: 11, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 11, name: 'Jdp', abbr: 'JDP', position: 12, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 12, name: 'Bookie', abbr: 'BOO', position: 13, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 13, name: 'Dennis', abbr: 'DEN', position: 14, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 14, name: 'Teezy', abbr: 'TEE', position: 15, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
                { id: 15, name: 'Dee', abbr: 'DEE', position: 16, baseBalls: 1, purchasedBalls: 0, maxPurchase: 2, discountPrice: null, standardPrice: 15, isReplacement: false, replacementBonus: 0, isTBWinner: false },
            ]);

            const [selectedPicks, setSelectedPicks] = useState([]);
            const [currentBallPool, setCurrentBallPool] = useState([]);
            const [isSpinning, setIsSpinning] = useState(false);
            const [wheelRotation, setWheelRotation] = useState(0);
            const [showModal, setShowModal] = useState(false);
            const [modalTeam, setModalTeam] = useState(null);
            const [modalPickNumber, setModalPickNumber] = useState(0);
            const [isLanding, setIsLanding] = useState(false);
            const [editMode, setEditMode] = useState(false);
            const [editPurchasesMode, setEditPurchasesMode] = useState(false);
            const [oddsTestResults, setOddsTestResults] = useState(null);

            const updateTeam = (id, field, value) => {
                setTeams(teams.map(t => t.id === id ? { ...t, [field]: value } : t));
                setOddsTestResults(null);
            };

            const getTotalBalls = (team) => {
                return team.baseBalls + team.purchasedBalls + team.replacementBonus;
            };

            const getTeamBallCountInPool = (teamId, pool = currentBallPool) => {
                return pool.filter(id => id === teamId).length;
            };

            const getTeamOddsInPool = (teamId, pool = currentBallPool) => {
                if (pool.length === 0) return '0.0';

                const ballCount = getTeamBallCountInPool(teamId, pool);

                return ((ballCount / pool.length) * 100).toFixed(1);
            };

            const buildPickRecord = (team, poolBeforePick, topFiveGuaranteeApplied = false) => {
                const pickBallCount = getTeamBallCountInPool(team.id, poolBeforePick);
                const pickTotalBalls = poolBeforePick.length;
                const pickPercentage = pickTotalBalls > 0 ? ((pickBallCount / pickTotalBalls) * 100).toFixed(1) : '0.0';

                return {
                    ...team,
                    pickBallCount,
                    pickTotalBalls,
                    pickPercentage,
                    topFiveGuaranteeApplied,
                };
            };

            const getPurchaseCost = (team) => {
                let cost = 0;

                for (let i = 0; i < team.purchasedBalls; i++) {
                    cost += (team.discountPrice && i < 2) ? team.discountPrice : team.standardPrice;
                }

                return cost;
            };

            const getRandomIndex = (maxExclusive) => {
                if (maxExclusive <= 0) return 0;

                if (window.crypto?.getRandomValues) {
                    const maxUint32 = 0x100000000;
                    const limit = maxUint32 - (maxUint32 % maxExclusive);
                    const values = new Uint32Array(1);
                    let value;

                    do {
                        window.crypto.getRandomValues(values);
                        value = values[0];
                    } while (value >= limit);

                    return value % maxExclusive;
                }

                return Math.floor(Math.random() * maxExclusive);
            };

            const shufflePool = (pool) => {
                const shuffled = [...pool];

                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = getRandomIndex(i + 1);
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                return shuffled;
            };

            const formatOneIn = (ballCount, totalBalls) => {
                if (!ballCount || !totalBalls) return '—';
                return (totalBalls / ballCount).toFixed(1);
            };

            const getTopFiveProtectedTeam = () => teams.find(team => team.position === 1);

            const isTopFiveGuaranteeActive = (pickNumber, pool) => {
                const protectedTeam = getTopFiveProtectedTeam();
                return pickNumber === 5 && protectedTeam && pool.includes(protectedTeam.id);
            };

            const choosePickIndex = (pool, pickNumber) => {
                if (isTopFiveGuaranteeActive(pickNumber, pool)) {
                    const protectedTeam = getTopFiveProtectedTeam();
                    const protectedIndexes = pool.map((teamId, index) => teamId === protectedTeam.id ? index : -1).filter(index => index !== -1);
                    return { randomIndex: protectedIndexes[getRandomIndex(protectedIndexes.length)], topFiveGuaranteeApplied: true };
                }
                return { randomIndex: getRandomIndex(pool.length), topFiveGuaranteeApplied: false };
            };

            const buildBallPool = () => {
                const pool = [];

                teams.forEach(team => {
                    for (let i = 0; i < getTotalBalls(team); i++) {
                        pool.push(team.id);
                    }
                });

                return shufflePool(pool);
            };

            const runOddsTest = () => {
                const pool = buildBallPool();
                const simulations = 10000;

                if (pool.length === 0) {
                    setOddsTestResults(null);
                    return;
                }

                const winsByTeam = teams.reduce((acc, team) => {
                    acc[team.id] = 0;
                    return acc;
                }, {});

                for (let i = 0; i < simulations; i++) {
                    const randomIndex = getRandomIndex(pool.length);
                    winsByTeam[pool[randomIndex]] += 1;
                }

                const results = teams.map(team => {
                    const balls = getTotalBalls(team);
                    const expectedPercentage = (balls / pool.length) * 100;
                    const simulatedPercentage = (winsByTeam[team.id] / simulations) * 100;

                    return {
                        id: team.id,
                        name: team.name,
                        position: team.position,
                        balls,
                        wins: winsByTeam[team.id],
                        expectedPercentage,
                        simulatedPercentage,
                        difference: simulatedPercentage - expectedPercentage,
                    };
                });

                setOddsTestResults({
                    simulations,
                    totalBalls: pool.length,
                    results,
                });
            };

            const startLottery = () => {
                const pool = buildBallPool();

                setCurrentBallPool(pool);
                setSelectedPicks([]);
                setWheelRotation(0);
                setPhase('lottery');
            };

            const drawPick = () => {
                if (currentBallPool.length === 0 || isSpinning) return;

                SoundManager.playPick();
                setIsSpinning(true);
                setIsLanding(false);

                const poolBeforePick = [...currentBallPool];
                const pickNumber = selectedPicks.length + 1;
                const { randomIndex, topFiveGuaranteeApplied } = choosePickIndex(poolBeforePick, pickNumber);
                const selectedId = poolBeforePick[randomIndex];
                const selectedTeam = teams.find(t => t.id === selectedId);
                const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick, topFiveGuaranteeApplied);

                const segmentAngle = 360 / poolBeforePick.length;
                const selectedSegmentCenterAngle = randomIndex * segmentAngle + segmentAngle / 2;

                const pointerAngle = 270;
                const targetRotation = pointerAngle - selectedSegmentCenterAngle;

                const currentRotationNormalized = ((wheelRotation % 360) + 360) % 360;
                const targetRotationNormalized = ((targetRotation % 360) + 360) % 360;

                let rotationDifference = targetRotationNormalized - currentRotationNormalized;

                if (rotationDifference < 0) {
                    rotationDifference += 360;
                }

                const spins = 8;
                const finalRotation = wheelRotation + spins * 360 + rotationDifference;

                setTimeout(() => {
                    setIsLanding(true);
                    setWheelRotation(finalRotation);
                }, 4000);

                setTimeout(() => {
                    SoundManager.playWin();
                    setModalTeam(selectedPickRecord);
                    setModalPickNumber(selectedPicks.length + 1);
                    setShowModal(true);
                    setIsSpinning(false);
                    setIsLanding(false);
                }, 6200);
            };

            const confirmPick = () => {
                setShowModal(false);
                setSelectedPicks([...selectedPicks, modalTeam]);
                setCurrentBallPool(currentBallPool.filter(id => id !== modalTeam.id));
            };

            const simulateAllPicks = () => {
                if (isSpinning || currentBallPool.length === 0) return;

                const allPicks = [...selectedPicks];
                let tempPool = [...currentBallPool];

                while (tempPool.length > 0) {
                    const poolBeforePick = [...tempPool];
                    const pickNumber = allPicks.length + 1;
                    const { randomIndex, topFiveGuaranteeApplied } = choosePickIndex(poolBeforePick, pickNumber);
                    const selectedId = tempPool[randomIndex];
                    const selectedTeam = teams.find(t => t.id === selectedId);
                    const selectedPickRecord = buildPickRecord(selectedTeam, poolBeforePick, topFiveGuaranteeApplied);

                    allPicks.push(selectedPickRecord);
                    tempPool = tempPool.filter(id => id !== selectedId);
                }

                setSelectedPicks(allPicks);
                setCurrentBallPool([]);
                setIsSpinning(false);
                setIsLanding(false);
                setPhase('results');
            };

            const reset = () => {
                setSelectedPicks([]);
                setCurrentBallPool([]);
                setIsSpinning(false);
                setIsLanding(false);
                setShowModal(false);
                setModalTeam(null);
                setWheelRotation(0);
                setEditMode(false);
                setPhase('setup');
            };

            const editPickName = (index, newName) => {
                const updated = [...selectedPicks];
                updated[index] = { ...updated[index], name: newName };
                setSelectedPicks(updated);
            };

            const movePickUp = (index) => {
                if (index === 0) return;

                const updated = [...selectedPicks];

                [updated[index - 1], updated[index]] = [updated[index], updated[index - 1]];

                setSelectedPicks(updated);
            };

            const movePickDown = (index) => {
                if (index === selectedPicks.length - 1) return;

                const updated = [...selectedPicks];

                [updated[index], updated[index + 1]] = [updated[index + 1], updated[index]];

                setSelectedPicks(updated);
            };

            const editTeamName = (id, newName) => {
                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
                setOddsTestResults(null);
            };

            const totalRevenue = teams.reduce((sum, t) => sum + getPurchaseCost(t), 0);
            const leaguePot = (entryAmount * 16) + totalRevenue;

            if (phase === 'setup') {
                return (
                    <div className="min-h-screen p-6 md:p-12">
                        <div className="max-w-2xl mx-auto">
                            <div className="text-center mb-12">

                                    <button onClick={() => setPhase('lottery')} className="flex-1 secondary-btn font-bold py-3 px-4 rounded-xl">← Back to Lottery</button>
                                )}

                                <button onClick={reset} className="flex-1 modern-btn font-bold py-3 px-4 rounded-xl">↻ New Lottery</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-6 md:p-12 flex items-center justify-center bg-gray-900">
                    <div className="text-center text-white">
                        <h1 className="text-4xl font-bold mb-4">Error</h1>
                        <p className="text-xl mb-4">Current phase: {phase}</p>

                        <button
                            onClick={() => setPhase('setup')}
                            className="modern-btn font-bold py-3 px-8 rounded-xl"
                        >
                            Reset to Setup
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
